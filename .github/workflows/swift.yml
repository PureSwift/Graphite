name: Swift

on:
  push:
    branches: [master]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The runners' stable Xcode has an older Swift: Xcode provides the
      # macOS SDK, the toolchain comes from swift.org.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.4.2"
      - name: Install dependencies
        run: brew install freetype pkg-config sdl3 cairo fontconfig
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build and test without FreeType
        run: swift test --disable-default-traits --scratch-path .build-notrait

  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: swift:6.4-noble
    env:
      SDL_VERSION: release-3.4.20
      SDL_VIDEO_DRIVER: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # The date tests read time zones from the system's database.
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            tzdata cmake ninja-build pkg-config git libcairo2-dev libfontconfig-dev \
            libfreetype-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libdrm-dev \
            libgbm-dev libegl-dev libgl-dev libgles-dev libvulkan-dev \
            libdbus-1-dev libudev-dev libpulse-dev libasound2-dev fonts-dejavu-core
      - name: Cache SDL3
        id: cache-sdl3
        uses: actions/cache@v4
        with:
          path: /opt/sdl3
          key: sdl3-${{ env.SDL_VERSION }}-noble-${{ matrix.arch }}
      - name: Build SDL3
        if: steps.cache-sdl3.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SDL_VERSION" https://github.com/libsdl-org/SDL.git /tmp/SDL
          cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/sdl3 -DSDL_TESTS=OFF
          cmake --build /tmp/SDL/build
          cmake --install /tmp/SDL/build
      - name: Configure SDL3 paths
        run: |
          echo "PKG_CONFIG_PATH=/opt/sdl3/lib/pkgconfig:/opt/sdl3/lib/$(gcc -dumpmachine)/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/sdl3/lib:/opt/sdl3/lib/$(gcc -dumpmachine)" >> "$GITHUB_ENV"
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Build and test without FreeType
        run: swift test --disable-default-traits --scratch-path .build-notrait
